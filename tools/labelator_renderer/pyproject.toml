[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labelator-renderer"
version = "0.1.0"
description = "Offline renderer for frozen .labelator v1 packages. Independent of the LABELATOR application."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pymupdf>=1.24.0",
  "Pillow>=10.0.0",
  "fonttools>=4.50.0",
]

[project.optional-dependencies]
dev = [
  "numpy>=1.26.0",
]

[project.scripts]
labelator-render = "labelator_renderer.cli:cli_main"

[tool.setuptools.packages.find]
where = ["src"]
